name: blender-pilot
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    profiles: [bundled-db]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blender_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-blender_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./docker-up.sh first}
    volumes:
      - ${PILOT_POSTGRES_DIR:-./postgres-data}:/var/lib/postgresql
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
  studio:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: studio
      args:
        BLENDER_VERSION: ${BLENDER_VERSION:-5.2.3}
        BLENDER_SHA256: ${BLENDER_SHA256:-78486c018b4443efe5e75ab54c290ed8c15abafd249b862c2c9ce2530a918eec}
    platform: linux/amd64
    init: true
    restart: unless-stopped
    shm_size: 1gb
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run ./docker-up.sh first}
      PILOT_INTERNAL_TOKEN: ${PILOT_INTERNAL_TOKEN:?Run ./docker-up.sh first}
      PILOT_RESOLUTION: ${PILOT_RESOLUTION:-1440x900x24}
      PILOT_MAX_STUDIOS: ${PILOT_MAX_STUDIOS:-3}
    volumes:
      - ${PILOT_DATA_DIR:-./data}:/data
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8091/health',{headers:{authorization:'Bearer '+process.env.PILOT_INTERNAL_TOKEN}}).then(async r=>process.exit(r.ok&&(await r.json()).ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 8
    stop_grace_period: 60s
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    platform: linux/amd64
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false
      studio:
        condition: service_healthy
    ports:
      - target: 8090
        published: "${PILOT_PORT:-8090}"
        host_ip: "${PILOT_BIND:-0.0.0.0}"
        protocol: tcp
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run ./docker-up.sh first}
      PILOT_PASSWORD: ${PILOT_PASSWORD:?Run ./docker-up.sh first}
      PILOT_INTERNAL_TOKEN: ${PILOT_INTERNAL_TOKEN:?Run ./docker-up.sh first}
      PILOT_RUNNER_URL: http://studio:8091
      PILOT_SECURE_COOKIE: ${PILOT_SECURE_COOKIE:-false}
      PILOT_DATA: /data
    volumes:
      - ${PILOT_DATA_DIR:-./data}:/data
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8090/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    stop_grace_period: 30s
