name: Validate
# Manual only; cloud development checks do not depend on GitHub Actions.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: disposable-test-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PILOT_TEST_DATABASE_URL: postgresql://postgres:disposable-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run check
  docker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare isolated test configuration
        run: |
          ./docker-up.sh --configure-only --blender-version 5.2.3
          cat > compose.test.yaml <<'YAML'
          services:
            studio:
              extra_hosts:
                - host.docker.internal:host-gateway
          YAML
      - run: docker compose --profile bundled-db -f compose.yaml -f compose.test.yaml up -d --build --wait --wait-timeout 240
      - name: Verify deployed binaries and browser
        run: |
          set -a
          . ./.env
          set +a
          PILOT_FIXTURE_BIND=0.0.0.0 PILOT_FIXTURE_HOST=host.docker.internal npm run test:e2e
      - name: Logs
        if: always()
        run: docker compose --profile bundled-db logs --no-color --tail=160
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-validation
          path: artifacts/
          if-no-files-found: ignore
      - if: always()
        run: docker compose --profile bundled-db down
